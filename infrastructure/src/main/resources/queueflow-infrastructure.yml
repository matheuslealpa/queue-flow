# Configuração de persistência e eventos compartilhada pela aplicação e pelos testes de integração.
queueflow:
  database:
    schema: ${DB_SCHEMA:queueflow}

spring:
  datasource:
    hikari:
      schema: ${queueflow.database.schema}
  flyway:
    create-schemas: true
    schemas: ${queueflow.database.schema}
    default-schema: ${queueflow.database.schema}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # a publicação acontece no fim da requisição: com o Redis fora, falha rápido e entrega localmente
      timeout: 2s
      connect-timeout: 2s
