server {
    listen 80;
    root /usr/share/nginx/html;

    # eventos em tempo real (SSE): sem buffer e com conexão longa; o heartbeat da API chega a cada 20s
    location ~ ^/api/v1/queues/[^/]+/events$ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # mesma origem que o app: a API não tem CORS
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~* \.(?:js|css|woff2?|ico|svg|png)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # rotas do Angular (/painel, /totem, /operador/…)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
